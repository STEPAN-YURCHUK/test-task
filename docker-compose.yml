# Весь проект одной командой: docker compose up -d --build
# Тесты в контейнерах:          docker compose --profile test run --rm back-test   (unit + e2e бэкенда)
#                               docker compose --profile test run --rm front-test  (unit фронтенда)

# Общие переменные бэкенда (и для тестового контейнера)
x-back-env: &back-env
  CORS_ORIGINS: ${FRONT_URL:-http://localhost:3001}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-comments}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comments}
  POSTGRES_DB: ${POSTGRES_DB:-comments}
  DB_SYNCHRONIZE: 'true'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili-master-key}
  JWT_CAPTCHA_SECRET: ${JWT_CAPTCHA_SECRET:-change-me-captcha-secret-in-production}
  JWT_CAPTCHA_TIME: 5m
  JWT_VOTER_SECRET: ${JWT_VOTER_SECRET:-change-me-voter-secret-in-production}
  # S3: по умолчанию — локальный LocalStack (сервис s3). Для DigitalOcean Spaces / AWS задайте S3_* в .env
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:4566}
  # адрес хранилища для браузера (presigned PUT); внутри docker бэкенд ходит по S3_ENDPOINT
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-comments}
  S3_FOLDER: ${S3_FOLDER:-comments/docker}
  S3_CDN_URL: ${S3_CDN_URL:-http://localhost:4566/comments/}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # параллельные воркеры Postgres используют /dev/shm; дефолтных 64 МБ не хватает уже на count(*) по 300k строк
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comments}
      POSTGRES_DB: ${POSTGRES_DB:-comments}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '${MEILI_HOST_PORT:-7702}:7700'
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 10

  # Локальное S3-совместимое хранилище (LocalStack): бакет и CORS создаёт docker/localstack/init-s3.sh
  s3:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-comments}
    ports:
      - '${S3_HOST_PORT:-4566}:4566'
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
      - s3-data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api get-bucket-cors --bucket $${S3_BUCKET_NAME} >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20

  back:
    build:
      context: ./back
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      <<: *back-env
      PORT: 4000
    ports:
      - '${BACK_HOST_PORT:-4000}:4000'

  front:
    build:
      context: ./front
      target: runtime
      args:
        # вшивается в клиентский бандл: адрес API, по которому ходит БРАУЗЕР
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    ports:
      - '${FRONT_HOST_PORT:-3001}:3000'

  # ---------- профиль test ----------

  test-db-init:
    image: postgres:17-alpine
    profiles: [test]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-comments}
    command: >
      sh -c "psql -h postgres -U ${POSTGRES_USER:-comments} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='comments_test'\" | grep -q 1
      || psql -h postgres -U ${POSTGRES_USER:-comments} -d postgres -c 'CREATE DATABASE comments_test'"

  # unit + e2e бэкенда против postgres/redis/meilisearch этого compose; S3 в e2e — в памяти
  back-test:
    build:
      context: ./back
      target: test
    profiles: [test]
    depends_on:
      test-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      <<: *back-env
      NODE_ENV: test
      POSTGRES_DB: comments_test
      # изоляция от рабочих данных: своя Redis DB и свой индекс Meilisearch
      REDIS_DB: 1
      MEILI_INDEX_PREFIX: test_
      CAPTCHA_FIXED_TEXT: e2e123
      THROTTLE_DISABLED: 'true'

  front-test:
    build:
      context: ./front
      target: test
    profiles: [test]

volumes:
  postgres-data:
  redis-data:
  meili-data:
  s3-data:
