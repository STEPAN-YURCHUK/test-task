# Часть nginx-конфига сайта в Forge (Site → Edit Nginx Configuration) — заменяет блок от ssl_protocols
# до конца server { }. Строки listen / server_name / ssl_certificate выше оставьте как сгенерировал Forge.
#
#   /api/*        → контейнер back (127.0.0.1:4009): REST /api/v1, документация /api/docs
#   /socket.io/*  → контейнер back, WebSocket (namespace /comments)
#   /storage/*    → контейнер storage (127.0.0.1:4010): файлы и прямая загрузка кусков по presigned-ссылкам
#   всё остальное → контейнер front (127.0.0.1:4008)

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";

index index.html index.htm;

charset utf-8;

# файл прямо в запросе комментария — до 5 МБ (+ поля формы); куски прямой загрузки в хранилище — по 5 МиБ
client_max_body_size 10m;

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3464767/server/*;

location /api/ {
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1m;
    proxy_connect_timeout 1m;
    proxy_pass http://127.0.0.1:4009;
}

location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # соединение долгоживущее: без этого nginx рвёт его через минуту тишины
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://127.0.0.1:4009;
}

# Хранилище (S3). Host передаётся как есть: presigned-ссылка подписана под https://test-task.pp.ua,
# и хранилище проверяет подпись по тому же Host. Путь не переписывается (/storage/... = /<бакет>/...)
location /storage/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
    proxy_pass http://127.0.0.1:4010;
}

# статика сборки Next с хешем в имени — кешируется браузером навсегда
location /_next/static/ {
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:4008;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location / {
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1m;
    proxy_connect_timeout 1m;
    proxy_pass http://127.0.0.1:4008;
}

access_log off;
error_log  /var/log/nginx/3464767-error.log error;

location ~ /\.(?!well-known).* {
    deny all;
}
