# Надстройка для сервера (Laravel Forge и любой VDS):
#   docker compose -p test-task --env-file <secrets> --env-file <env> -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - наружу не торчит ничего: базы без портов на хосте, фронт, API и хранилище — только на 127.0.0.1 (их отдаёт nginx);
# - Meilisearch в режиме production (MEILI_MASTER_KEY обязателен, не короче 16 символов);
# - файлы — в локальном S3 (SeaweedFS) с постоянным томом вместо LocalStack, который их не хранит.
#   Браузер ходит в хранилище через тот же домен: https://<домен>/<бакет>/... (nginx → storage),
#   поэтому CORS не нужен, а presigned-ссылки подписаны под публичный адрес (S3_PUBLIC_ENDPOINT = API_URL).
# !reset / !override — Docker Compose ≥ 2.24.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  meilisearch:
    environment:
      MEILI_ENV: production
    ports: !reset []

  # LocalStack — только для локального запуска
  s3:
    profiles: [local-s3]

  # S3-совместимое хранилище. Ключ приложения — полный доступ; анонимно — только чтение объектов бакета
  # (готовые файлы публичные, как на CDN). Скрипт встроен сюда, а не примонтирован: папки старых релизов удаляются.
  # 3.97 — проверенная версия: 3.85 не принимает подписи AWS SDK v3, 4.50 отклоняет presigned PUT (BadDigest)
  storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID не задан}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY не задан}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-storage}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -f /tmp/ready
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:%s"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" "$$S3_BUCKET_NAME" > /tmp/s3.json
        weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0 &
        until wget -q -O /dev/null http://127.0.0.1:8333/healthz 2>/dev/null; do sleep 1; done
        until echo "s3.bucket.create -name $$S3_BUCKET_NAME" | weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 2>&1 | grep -q 'created bucket\|already exists'; do sleep 1; done
        touch /tmp/ready
        wait
    volumes:
      - storage-data:/data
    ports:
      - '127.0.0.1:${STORAGE_HOST_PORT:-4010}:8333'
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  back:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      S3_REGION: us-east-1
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: ${API_URL:?API_URL не задан}
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-storage}
      S3_FOLDER: ${S3_FOLDER:-prod}
      S3_CDN_URL: ${API_URL}/${S3_BUCKET_NAME:-storage}/
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports: !override
      - '127.0.0.1:${BACK_HOST_PORT:-4009}:4000'

  front:
    ports: !override
      - '127.0.0.1:${FRONT_HOST_PORT:-4008}:3000'

volumes:
  storage-data:
